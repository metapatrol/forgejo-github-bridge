<mp-app-shell project="forgejo-github-bridge" home="/" [nav]="groups()">
  <!-- the console's own state in one word; folded, only its dot -->
  <ng-template mpShellStatus let-collapsed>
    <a
      routerLink="/system"
      class="mp-status no-underline hover:underline"
      [attr.data-status]="status.connection().status"
      aria-live="polite"
      [title]="status.connection().detail || status.connection().text"
    >
      <span [class.sr-only]="collapsed">{{ status.connection().text }}</span>
    </a>
  </ng-template>

  <router-outlet />
</mp-app-shell>
