<mp-page-header title="Pairs" [note]="pairs.body()?.total?.toString()" />

<section class="mp-panel mp-panel-flush">
  <div class="mp-panel-head flex-wrap items-center gap-3">
    <mp-list-search
      class="flex-nowrap"
      [query]="q()"
      [shown]="pairs.body()?.items?.length ?? 0"
      [total]="pairs.body()?.total ?? 0"
      placeholder="Title or number"
    />
    <div class="flex flex-wrap items-center gap-2">
      <label class="sr-only" for="f-repository">Repository</label>
      <select
        id="f-repository"
        class="mp-input w-auto"
        [value]="repository() ?? ''"
        (change)="filter('repository', $any($event.target).value)"
      >
        <option value="">all repositories</option>
        @for (r of repos.body() ?? []; track r.key) {
          <option [value]="r.key" [selected]="r.key === repository()">{{ r.key }}</option>
        }
      </select>
      <label class="sr-only" for="f-kind">Kind</label>
      <select
        id="f-kind"
        class="mp-input w-auto"
        [value]="params().kind ?? ''"
        (change)="filter('kind', $any($event.target).value)"
      >
        <option value="">issues and pull requests</option>
        <option value="issue" [selected]="params().kind === 'issue'">issues</option>
        <option value="pull" [selected]="params().kind === 'pull'">pull requests</option>
      </select>
      <label class="sr-only" for="f-state">State</label>
      <select
        id="f-state"
        class="mp-input w-auto"
        [value]="params().state ?? ''"
        (change)="filter('state', $any($event.target).value)"
      >
        <option value="">any state</option>
        <option value="open" [selected]="params().state === 'open'">open</option>
        <option value="closed" [selected]="params().state === 'closed'">closed</option>
        <option value="merged" [selected]="params().state === 'merged'">merged</option>
      </select>
      <label class="sr-only" for="f-origin">Origin</label>
      <select
        id="f-origin"
        class="mp-input w-auto"
        [value]="params().origin ?? ''"
        (change)="filter('origin', $any($event.target).value)"
      >
        <option value="">from either side</option>
        <option value="github" [selected]="params().origin === 'github'">from GitHub</option>
        <option value="forgejo" [selected]="params().origin === 'forgejo'">from Forgejo</option>
      </select>
    </div>
  </div>

  <mp-load-state
    [error]="pairs.error()"
    [loading]="pairs.isLoading() && !pairs.hasValue()"
    what="pairs"
  />
  @if (pairs.hasValue()) {
    <app-pairs-table
      [pairs]="pairs.body()?.items ?? []"
      [showRepository]="!repository()"
      empty="No pair matches."
    />
    <div class="flex justify-end border-t border-line px-4 py-2">
      <app-pager
        [offset]="offset()"
        [limit]="limit"
        [shown]="pairs.body()?.items?.length ?? 0"
        [total]="pairs.body()?.total ?? 0"
        (moved)="page($event)"
      />
    </div>
  }
</section>
