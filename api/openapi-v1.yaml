openapi: "3.0.3"

info:
  title: forgejo-github-bridge console API
  version: "1.0.0"
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    What the bridge knows, read-only: the bridged repositories, the pairs of
    issues and pull requests it keeps in step, and the work it has queued.

    Everything comes from the bridge's database. No request reaches GitHub or
    Forgejo, and no request changes anything: the queries run in read-only
    transactions.

    The API has no sign-in of its own. Whoever reaches the console listener
    can read it; who may reach it is decided in front of it
    (docs/console.md).

servers:
  - url: /api/v1

tags:
  - name: status
    description: The instance answering, the instance doing the work, the queue.
  - name: repositories
    description: The configured repository pairs and what is held for each.
  - name: pairs
    description: Issues and pull requests and their counterparts.
  - name: queue
    description: Work waiting to be done, and why it may be stuck.

paths:
  /status:
    get:
      operationId: getStatus
      tags: [status]
      summary: The bridge at a glance
      description: |
        This instance, the instance doing the work, and the queue.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        default: { $ref: "#/components/responses/Error" }

  /events:
    get:
      operationId: streamEvents
      tags: [status]
      summary: Changes as they happen
      description: |
        A Server-Sent Events stream (`text/event-stream`) of changes, so that
        live views need not poll. Events name what changed, never its
        content; a view reloads what it shows. Event types:

        - `ready`: the stream is open. Changes before this moment are not
          sent; load what you show now.
        - `pair`: a pair was created, changed or removed, or its pull request
          state or comments changed: `{"op", "id", "repository"?, "pairKind"?}`.
        - `queue`: an entry was queued, retried or done:
          `{"op", "repository", "side", "number"}`.
        - `cursor`: a poll read further: `{"op", "repository", "side", "stream"}`.
        - `leader`: the instance holding the leader lock changed: `{"present"}`.
        - `rateLimit`: the GitHub rate limit was saved anew: `{"op", "resource"}`.
        - `maintenance`: a database maintenance round started or ended: `{"op", "id", "finished"}`.
        - `resync`: events were missed, by a slow client or a lost database
          connection; reload everything.

        A comment line every 25 seconds keeps the connection open through
        proxies.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default: { $ref: "#/components/responses/Error" }

  /system:
    get:
      operationId: getSystem
      tags: [status]
      summary: The service and its database
      description: |
        This instance and how it is configured, and how the database is
        doing and how it is kept: size, connections, cache, transaction age,
        the bridge's tables with their autovacuum thresholds and indexes,
        the applied migrations, and the maintenance PostgreSQL runs now. All
        database figures are PostgreSQL's.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/System" }
        default: { $ref: "#/components/responses/Error" }

  /authors:
    get:
      operationId: listAuthors
      tags: [pairs]
      summary: Who opened the pairs
      description: |
        Everyone who opened an issue or pull request the bridge holds, the
        most active first: GitHub logins for what came from GitHub, Forgejo
        logins for issues published from Forgejo. The bridge records the
        author of a pair, not of its comments.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Author" }
        default: { $ref: "#/components/responses/Error" }

  /repositories:
    get:
      operationId: listRepositories
      tags: [repositories]
      summary: The bridged repositories
      description: |
        Every configured pair of repositories, with what the bridge holds for
        it: pair counts, queued work and how far each poll has read.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Repository" }
        default: { $ref: "#/components/responses/Error" }

  /pairs:
    get:
      operationId: listPairs
      tags: [pairs]
      summary: Pairs of issues and pull requests
      description: |
        Newest first. A pair is a GitHub issue or pull request and its Forgejo
        counterpart.
      parameters:
        - name: repository
          in: query
          description: A repository's key, the GitHub repository as owner/name.
          schema: { type: string }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/PairKind" }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/PairState" }
        - name: origin
          in: query
          schema: { $ref: "#/components/schemas/Side" }
        - name: author
          in: query
          description: Who opened it, on the origin side; combine with origin to tell a GitHub login from a Forgejo one.
          schema: { type: string, maxLength: 100 }
        - name: q
          in: query
          description: Matches the title, case-insensitively, or a number on either side.
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairPage" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /pairs/{id}:
    get:
      operationId: getPair
      tags: [pairs]
      summary: One pair, with its comments
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairDetail" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /queue:
    get:
      operationId: listQueue
      tags: [queue]
      summary: Queued work
      description: |
        Resources waiting to be reconciled, the ones that failed first, then
        by when they are due. An entry that keeps failing names its last
        error.
      parameters:
        - name: repository
          in: query
          schema: { type: string }
        - name: failing
          in: query
          description: Only entries whose last attempt failed.
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueueEntry" }
        default: { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Something went wrong
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Side:
      type: string
      enum: [github, forgejo]

    PairKind:
      type: string
      enum: [issue, pull]

    PairState:
      type: string
      description: |
        open and closed for every pair; merged only for pull requests. A
        closed pull request was closed without merging.
      enum: [open, closed, merged]

    Status:
      type: object
      required: [version, commit, builtAt, instance, mode, queue, forgejoUrl, githubRateLimits]
      properties:
        version: { type: string }
        commit: { type: string }
        builtAt: { type: string }
        instance:
          type: string
          description: The host name of the instance that answered.
        mode:
          type: string
          description: bridge, or console for an instance that only serves the console.
          enum: [bridge, console]
        leader:
          $ref: "#/components/schemas/Leader"
        queue: { $ref: "#/components/schemas/QueueSummary" }
        forgejoUrl:
          type: string
          description: Forgejo's address for people's browsers.
        githubRateLimits:
          type: array
          description: |
            The GitHub App installation's rate-limit windows, as the instance
            doing the work last saw them; empty until it has made a request.
          items: { $ref: "#/components/schemas/RateLimit" }

    RateLimit:
      type: object
      required: [resource, limit, remaining, used, resetAt, observedAt]
      properties:
        resource:
          type: string
          description: GitHub's name for the budget; "core" is the REST API the bridge uses.
        limit: { type: integer }
        remaining: { type: integer }
        used: { type: integer }
        resetAt:
          type: string
          format: date-time
          description: When the window starts over.
        observedAt:
          type: string
          format: date-time
          description: When the response these figures come from arrived.

    Leader:
      type: object
      description: |
        The instance holding the leader lock, the one doing the work. Absent
        when no instance holds it.
      required: [present]
      properties:
        present: { type: boolean }
        instance:
          type: string
          description: Its host name, when the database lets this instance see it.
        connectedAt:
          type: string
          format: date-time
          description: When the connection holding the lock was opened.

    QueueSummary:
      type: object
      required: [depth, failing]
      properties:
        depth: { type: integer }
        failing: { type: integer }
        oldestMarkedAt:
          type: string
          format: date-time

    Repository:
      type: object
      required:
        - key
        - github
        - forgejo
        - githubUrl
        - forgejoUrl
        - pullRequests
        - targetBranches
        - rebaseRequests
        - importLabel
        - publishLabel
        - counts
        - queue
        - cursors
      properties:
        key:
          type: string
          description: The GitHub repository, owner/name; what every other resource refers to.
        github: { type: string }
        forgejo: { type: string }
        githubUrl: { type: string }
        forgejoUrl: { type: string }
        contrib:
          type: string
          description: |
            The contrib fork, when configured. Absent with pull requests on
            means the default, the contrib account's fork under the Forgejo
            repository's name.
        pullRequests:
          type: boolean
          description: Whether pull requests are imported.
        targetBranches:
          type: array
          items: { type: string }
        rebaseRequests: { type: boolean }
        importLabel: { type: string }
        publishLabel: { type: string }
        importSince:
          type: string
          format: date-time
        counts: { $ref: "#/components/schemas/PairCounts" }
        queue: { $ref: "#/components/schemas/QueueSummary" }
        cursors:
          type: array
          items: { $ref: "#/components/schemas/Cursor" }

    Author:
      type: object
      required: [login, side, issues, pulls, lastAt]
      properties:
        login: { type: string }
        side:
          $ref: "#/components/schemas/Side"
        profileUrl:
          type: string
          description: Their profile on that side.
        issues: { type: integer }
        pulls: { type: integer }
        lastAt:
          type: string
          format: date-time
          description: When the newest of their pairs was made.

    PairCounts:
      type: object
      required: [issuesOpen, issuesClosed, pullsOpen, pullsMerged, pullsClosed]
      properties:
        issuesOpen: { type: integer }
        issuesClosed: { type: integer }
        pullsOpen: { type: integer }
        pullsMerged: { type: integer }
        pullsClosed: { type: integer }

    Cursor:
      type: object
      description: How far one poll has read.
      required: [side, stream, cursor, updatedAt]
      properties:
        side: { $ref: "#/components/schemas/Side" }
        stream:
          type: string
          enum: [issues, comments]
        cursor:
          type: string
          format: date-time
          description: The last change the poll has seen, by the forge's clock.
        updatedAt:
          type: string
          format: date-time
          description: When the cursor last moved.

    PairPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Pair" }
        total:
          type: integer
          description: How many pairs match, across all pages.

    Pair:
      type: object
      required:
        - id
        - repository
        - kind
        - origin
        - state
        - title
        - author
        - githubNumber
        - forgejoNumber
        - githubUrl
        - forgejoUrl
        - comments
        - createdAt
        - updatedAt
      properties:
        id: { type: integer, format: int64 }
        repository: { type: string }
        kind: { $ref: "#/components/schemas/PairKind" }
        origin:
          $ref: "#/components/schemas/Side"
        state: { $ref: "#/components/schemas/PairState" }
        title:
          type: string
          description: The title on the origin side when the pair was last reconciled; empty until then.
        author:
          type: string
          description: Who opened it, on the origin side.
        githubNumber: { type: integer, format: int64 }
        forgejoNumber: { type: integer, format: int64 }
        githubUrl: { type: string }
        forgejoUrl: { type: string }
        comments:
          type: integer
          description: How many comments are paired.
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: When the bridge last changed what it holds for the pair.
        pull: { $ref: "#/components/schemas/PullRequest" }
        queued: { $ref: "#/components/schemas/QueueEntry" }

    PullRequest:
      type: object
      description: What a pull request pair has on top of an issue pair.
      required:
        - contribBranch
        - importedHeadSha
        - headFrozen
        - touchesCi
        - rebaseRequested
        - outcomeReported
        - updatedAt
      properties:
        contribBranch: { type: string }
        contribBranchUrl:
          type: string
          description: The branch in the contrib fork, when the fork is known.
        importedHeadSha:
          type: string
          description: The commit the bridge last pushed to the contrib branch.
        headFrozen:
          type: boolean
          description: Someone else pushed to the contrib branch; the bridge no longer updates it.
        touchesCi:
          type: boolean
          description: The pull request changes CI configuration.
        rebaseRequested:
          type: boolean
          description: The bridge currently asks the contributor to rebase.
        rebaseCommentUrl:
          type: string
          description: The bridge's comment on GitHub about rebasing, when it wrote one.
        outcomeReported:
          type: boolean
          description: The merge or close has been reported on GitHub.
        updatedAt: { type: string, format: date-time }

    PairDetail:
      allOf:
        - $ref: "#/components/schemas/Pair"
        - type: object
          required: [commentPairs]
          properties:
            commentPairs:
              type: array
              items: { $ref: "#/components/schemas/CommentPair" }

    CommentPair:
      type: object
      required: [id, origin, githubCommentId, forgejoCommentId, githubUrl, forgejoUrl, createdAt]
      properties:
        id: { type: integer, format: int64 }
        origin: { $ref: "#/components/schemas/Side" }
        githubCommentId: { type: integer, format: int64 }
        forgejoCommentId: { type: integer, format: int64 }
        githubUrl: { type: string }
        forgejoUrl: { type: string }
        createdAt: { type: string, format: date-time }

    QueueEntry:
      type: object
      required: [repository, side, number, markedAt, notBefore, attempts, url]
      properties:
        repository: { type: string }
        side:
          $ref: "#/components/schemas/Side"
        number:
          type: integer
          format: int64
          description: |
            The issue or pull request number on that side. Entries for a
            pair are keyed by the GitHub number.
        url: { type: string }
        pairId:
          type: integer
          format: int64
          description: The pair it belongs to, if it is one.
        kind:
          $ref: "#/components/schemas/PairKind"
        markedAt:
          type: string
          format: date-time
          description: When it was last marked as changed.
        notBefore:
          type: string
          format: date-time
          description: When it is due.
        attempts:
          type: integer
          description: Failed attempts since it last succeeded.
        lastError:
          type: string

    System:
      type: object
      required: [service, database, tables, migrations, running, maintenance]
      properties:
        maintenance: { $ref: "#/components/schemas/Maintenance" }
        service: { $ref: "#/components/schemas/Service" }
        database: { $ref: "#/components/schemas/SystemDatabase" }
        tables:
          type: array
          description: The bridge's tables, the largest first.
          items: { $ref: "#/components/schemas/SystemTable" }
        migrations:
          type: array
          items: { $ref: "#/components/schemas/Migration" }
        running:
          type: array
          description: Maintenance statements PostgreSQL runs now, autovacuum included.
          items: { type: string }

    Maintenance:
      type: object
      description: |
        The bridge's own database maintenance: every interval, the active
        instance vacuums and analyzes every table, drops what interrupted
        index rebuilds left and rebuilds invalid indexes.
      required: [intervalSeconds, rounds]
      properties:
        intervalSeconds:
          type: integer
          description: Time between two rounds, as this instance is configured; 0 when they are off.
        nextRoundAt:
          type: string
          format: date-time
          description: When the next round is due; absent when maintenance is off.
        rounds:
          type: array
          description: The newest rounds first, at most 20.
          items: { $ref: "#/components/schemas/MaintenanceRound" }

    MaintenanceRound:
      type: object
      required: [startedAt, tables, rebuilt, dropped, failures]
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt:
          type: string
          format: date-time
          description: Absent while the round runs.
        tables:
          type: array
          description: Tables vacuumed and analyzed.
          items: { type: string }
        rebuilt:
          type: array
          description: Invalid indexes rebuilt.
          items: { type: string }
        dropped:
          type: array
          description: Leftovers of interrupted rebuilds dropped.
          items: { type: string }
        failures:
          type: array
          items: { type: string }

    Service:
      type: object
      required: [version, commit, builtAt, goVersion, instance, mode, startedAt, pollIntervalSeconds, fullResyncSeconds, repositories, pullRequestRepositories]
      properties:
        version: { type: string }
        commit: { type: string }
        builtAt: { type: string }
        goVersion: { type: string }
        instance:
          type: string
          description: The host name of the instance that answered.
        mode:
          type: string
          enum: [bridge, console]
        startedAt: { type: string, format: date-time }
        pollIntervalSeconds:
          type: integer
          description: How often each repository is polled on each side.
        fullResyncSeconds:
          type: integer
          description: How often every open pair is reconciled whether or not it changed.
        repositories:
          type: integer
          description: Configured repository pairs.
        pullRequestRepositories:
          type: integer
          description: Of those, how many import pull requests.
        leader: { $ref: "#/components/schemas/Leader" }

    SystemDatabase:
      type: object
      required: [version, sizeBytes, connections, maxConnections, poolSize, poolInUse, poolMax, blocksHit, blocksRead, deadlocks, tempBytes, xidAge, freezeMaxAge, settings]
      properties:
        version:
          type: string
          description: PostgreSQL's version.
        sizeBytes: { type: integer, format: int64 }
        connections:
          type: integer
          format: int64
          description: Sessions on this database now.
        maxConnections:
          type: integer
          format: int64
          description: The most the server takes, for all databases.
        poolSize:
          type: integer
          format: int64
          description: Connections this instance holds.
        poolInUse: { type: integer, format: int64 }
        poolMax:
          type: integer
          format: int64
          description: The most this instance opens.
        blocksHit:
          type: integer
          format: int64
          description: Blocks found in shared buffers, since statsReset.
        blocksRead:
          type: integer
          format: int64
          description: Blocks read from disk, since statsReset.
        deadlocks: { type: integer, format: int64 }
        tempBytes:
          type: integer
          format: int64
          description: Written to temporary files, when work_mem was too small.
        xidAge:
          type: integer
          format: int64
          description: How many transactions ago the oldest unfrozen row was written.
        freezeMaxAge:
          type: integer
          format: int64
          description: At this xidAge autovacuum vacuums against wraparound.
        statsReset: { type: string, format: date-time }
        settings:
          type: array
          items: { $ref: "#/components/schemas/Setting" }

    Setting:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    SystemTable:
      type: object
      required: [name, totalBytes, heapBytes, indexBytes, liveRows, deadRows, modifiedSinceAnalyze, vacuumThreshold, analyzeThreshold, indexes]
      properties:
        name: { type: string }
        totalBytes: { type: integer, format: int64 }
        heapBytes: { type: integer, format: int64 }
        indexBytes: { type: integer, format: int64 }
        liveRows: { type: integer, format: int64 }
        deadRows: { type: integer, format: int64 }
        modifiedSinceAnalyze: { type: integer, format: int64 }
        vacuumThreshold:
          type: integer
          format: int64
          description: Dead rows at which autovacuum vacuums the table.
        analyzeThreshold:
          type: integer
          format: int64
          description: Changed rows at which autovacuum analyzes the table.
        lastVacuum: { type: string, format: date-time }
        lastAutovacuum: { type: string, format: date-time }
        lastAnalyze: { type: string, format: date-time }
        lastAutoanalyze: { type: string, format: date-time }
        indexes:
          type: array
          items: { $ref: "#/components/schemas/SystemIndex" }

    SystemIndex:
      type: object
      required: [name, method, bytes, scans, valid]
      properties:
        name: { type: string }
        method: { type: string }
        bytes: { type: integer, format: int64 }
        scans: { type: integer, format: int64 }
        valid:
          type: boolean
          description: False for an index a failed build left behind.

    Migration:
      type: object
      required: [name, appliedAt]
      properties:
        name: { type: string }
        appliedAt: { type: string, format: date-time }
