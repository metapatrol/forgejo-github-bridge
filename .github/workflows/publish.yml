# What the GitHub mirror publishes for everyone outside the private network.
#
# The repository lives on Forgejo, which builds, tests and releases it
# (.forgejo/workflows) and pushes its images to the internal registry. GitHub
# gets a push mirror of it: branches and tags arrive as pushes, and this
# workflow builds the same sources from them. It decides nothing — versions are
# semantic-release's, on Forgejo; a tag arriving here is only built.
#
# Forgejo reads .forgejo/workflows and ignores this directory.
#
#   ghcr.io/metapatrol/forgejo-github-bridge
#     :0.1.0 :0.1 :latest   from a release tag
#     :main :<short sha>    from main
#   oci://ghcr.io/metapatrol/charts/forgejo-github-bridge{,-grafana-dashboard}
#     :0.1.0                from a release tag
#   a GitHub release with binaries and both charts, from a release tag
#
# A release tagged before this workflow existed is built by running it by hand
# with that tag. The base images are passed explicitly, so a tag whose
# Dockerfile still names the internal registry builds too.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.1.0. Empty builds the branch it runs on.
        required: false
        default: ""
      latest:
        description: Also tag the image latest — for the newest release only.
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27"
  HELM_VERSION: v3.16.3

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.m.outputs.ref }}
      tag: ${{ steps.m.outputs.tag }}
      version: ${{ steps.m.outputs.version }}
      commit: ${{ steps.m.outputs.commit }}
      revision: ${{ steps.m.outputs.revision }}
      built_at: ${{ steps.m.outputs.built_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: m
        env:
          TAG: ${{ inputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          echo "ref=${TAG:-$GITHUB_REF}" >> "$GITHUB_OUTPUT"
          echo "revision=$commit" >> "$GITHUB_OUTPUT"
          echo "commit=${commit::7}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          ref="${TAG:-$GITHUB_REF_NAME}"
          if [[ -n "$TAG" || "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $ref"; exit 1; }
            echo "tag=$ref" >> "$GITHUB_OUTPUT"
            echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${commit::7}" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io wants the owner in lower case.
          images: ghcr.io/${{ github.repository_owner }}/forgejo-github-bridge
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }},enable=${{ needs.meta.outputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.latest == true }}
            type=ref,event=branch,enable=${{ inputs.tag == '' }}
            type=raw,value=${{ needs.meta.outputs.commit }}
          labels: |
            org.opencontainers.image.title=forgejo-github-bridge
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ needs.meta.outputs.revision }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ needs.meta.outputs.commit }}
            BUILT_AT=${{ needs.meta.outputs.built_at }}
            GO_IMAGE=docker.io/library/golang:${{ env.GO_VERSION }}-alpine
            RUNTIME_IMAGE=docker.io/library/alpine:3.24
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Charts and the GitHub release, for release tags only. After the image:
  # a release whose image does not exist is worse than none.
  release:
    needs: [meta, image]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Binaries
        env:
          CGO_ENABLED: "0"
          COMMIT: ${{ needs.meta.outputs.commit }}
          BUILT_AT: ${{ needs.meta.outputs.built_at }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT -X main.builtAt=$BUILT_AT" \
              -o "dist/forgejo-github-bridge-linux-$arch" ./cmd/forgejo-github-bridge
          done
          (cd dist && sha256sum forgejo-github-bridge-linux-* > SHA256SUMS)
      - name: Charts
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for chart in charts/forgejo-github-bridge charts/forgejo-github-bridge-grafana-dashboard; do
            # The released chart points at the public image by default.
            sed -i "s#^  repository: .*forgejo-github-bridge\$#  repository: ghcr.io/${OWNER,,}/forgejo-github-bridge#" "$chart/values.yaml"
            helm package "$chart" --version "$VERSION" --app-version "$VERSION" -d dist
          done
          for tgz in dist/*.tgz; do
            helm push "$tgz" "oci://ghcr.io/${OWNER,,}/charts"
          done
      - name: Release notes
        run: |
          # This version's section of the changelog semantic-release wrote.
          awk -v v="$VERSION" '
            /^#+ \[?[0-9]+\.[0-9]+\.[0-9]+/ { if (on) exit; if (index($0, v)) { on = 1; next } }
            on { print }' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Release $TAG" > dist/notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/forgejo-github-bridge-linux-* dist/SHA256SUMS dist/*.tgz --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes-file dist/notes.md \
              dist/forgejo-github-bridge-linux-* dist/SHA256SUMS dist/*.tgz
          fi
